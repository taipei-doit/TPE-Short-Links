<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>臺北市短網址服務</title>
    <!-- 公開頁大標使用明體（公文語彙）；只載 700/900 兩個字重控制體積 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 無障礙導盲磚（:::）與跳至主要內容連結：平時隱藏，鍵盤聚焦時浮現 */
      .access-key-link {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 2000;
        padding: 6px 12px;
        background: #ffffff;
        color: #16324a;
        font-weight: 700;
        text-decoration: none;
        border: 2px solid #0f5c86;
        border-radius: 4px;
      }
      .access-key-link:focus {
        left: 8px;
        top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
