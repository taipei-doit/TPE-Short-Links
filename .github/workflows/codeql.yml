name: CodeQL 程式碼弱點掃描

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每週一 01:30 UTC（台北時間 09:30）定期重掃，
    # 以便在沒有異動時仍能發現新公布的弱點模式。
    - cron: "30 1 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: 掃描 ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - name: 執行分析
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
